<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Passport & Visa | TeraPhotoStudio V3</title><link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.6.2/cropper.min.css"><link rel="stylesheet" href="css/passport.css"></head>
<body>
<header class="appbar"><a href="index.html" class="brand">📸 TeraPhotoStudio <small>V3</small></a><a href="index.html" class="navBtn">← Dashboard</a></header>
<main class="studio">
<section class="controls">
  <div class="title"><div><h1>Passport / Visa Photo</h1><p>Select, crop, change background and prepare a clean photo-only A4 sheet.</p></div><button id="newBtn" class="outline">New Photo</button></div>
  <div class="controlGrid">
    <div class="control"><label>1. Photo</label><input id="upload" type="file" accept="image/*"><button id="chooseBtn" class="choose">📷 Select Photo</button></div>
    <div class="control"><label>2. Size</label><select id="photoSize"><option value="35x45">35 × 45 mm</option><option value="25x35">25 × 35 mm</option><option value="2x2">2 × 2 inch</option></select></div>
    <div class="control"><label>3. Copies</label><select id="copies"><option value="8">8 Photos</option><option value="16">16 Photos</option><option value="32">32 Photos</option></select></div>
    <div class="control"><label>4. Background</label><select id="bgColor"><option value="original">Keep Original</option><option value="#ffffff">White</option><option value="#dff3ff">Very Light Blue</option><option value="#87cefa">Light Blue</option><option value="#0d6efd">Blue</option><option value="#ff0000">Red</option><option value="#f5f5dc">Cream</option><option value="#00aa00">Green</option><option value="custom">Custom</option></select><input id="customBg" type="color" value="#ffffff" hidden></div>
    <div class="control"><label>Background strength</label><input id="tolerance" type="range" min="15" max="100" value="45"><span id="tolValue">45</span></div>
    <div class="buttons"><button id="cropBtn" class="secondary">✂ Crop</button><button id="generateBtn" class="primary">Generate A4</button><button id="downloadBtn" class="success">Download PDF</button><button id="printBtn" class="dark">Print Photos</button></div>
  </div>
  <div id="status" class="status">Select a photo to begin.</div>
</section>
<section class="work"><div class="previewTitle"><h2>Preview</h2><span>Print/PDF contains photos only</span></div><div id="preview" class="preview"><div class="empty">Your photo preview will appear here.</div></div></section>
</main>
<div id="cropModal" class="modal hidden"><div class="modalBox"><div class="modalHead"><h2>Crop Photo</h2><button id="closeCrop">×</button></div><div class="cropArea"><img id="cropImage" alt="Crop"></div><div class="modalActions"><button id="cancelCrop" class="outline">Cancel</button><button id="applyCrop" class="primary">Apply Crop</button></div></div></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.6.2/cropper.min.js"></script><script src="js/passport.js"></script>
</body></html>
