<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Passport / Visa Photo</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#eef2f6;color:#172033;font-family:Arial,Segoe UI,sans-serif}.bar{height:68px;background:#fff;border-bottom:1px solid #dfe5ec;display:flex;align-items:center;padding:0 18px;gap:12px}.bar a,.bar button{border:1px solid #ccd5df;background:#fff;border-radius:8px;padding:10px 14px;text-decoration:none;color:#172033;cursor:pointer}.bar strong{font-size:19px;flex:1}.main{max-width:1400px;margin:auto;padding:18px}.controls{background:#fff;border:1px solid #dfe5ec;border-radius:14px;padding:16px;display:flex;gap:12px;flex-wrap:wrap;align-items:end}.field{display:flex;flex-direction:column;gap:6px;font-size:12px;font-weight:bold}.field input,.field select{height:40px;border:1px solid #ccd5df;border-radius:7px;padding:0 9px;background:#fff}.file{background:#1769e0;color:#fff;border-radius:8px;padding:11px 15px;cursor:pointer;font-weight:bold}.file input{display:none}.btn{height:40px;border:0;border-radius:7px;padding:0 15px;color:#fff;font-weight:bold;cursor:pointer}.crop{background:#6b4fd3}.green{background:#138a50}.dark{background:#26364d}.gray{background:#eef1f5;color:#172033;border:1px solid #ccd5df}.status{margin:12px 0;padding:10px 13px;border-radius:8px;background:#e8f1ff;color:#174a85}.status.ok{background:#eaf8f0;color:#12633b}.status.err{background:#fff0f0;color:#9b1c1c}.layout{display:grid;grid-template-columns:380px 1fr;gap:18px}.panel{background:#fff;border:1px solid #dfe5ec;border-radius:14px;padding:15px}.panel h3{margin:0 0 12px}.photoArea{height:500px;background:#f5f7fa;border:1px dashed #bcc6d2;border-radius:10px;display:flex;align-items:center;justify-content:center;overflow:hidden;position:relative}.photoArea canvas.photoCanvas{max-width:100%;max-height:100%;display:block}.cropBox{position:absolute;border:3px solid #1769e0;box-shadow:0 0 0 9999px #0006;cursor:move;display:none;z-index:5}.cropBox .handle{position:absolute;width:20px;height:20px;right:-10px;bottom:-10px;background:#1769e0;border-radius:50%;cursor:nwse-resize}.hint{color:#667085;font-size:13px;text-align:center}.preview{background:#cbd2da;min-height:700px;padding:18px;display:flex;flex-direction:column;align-items:center;gap:18px;border-radius:10px}.page{width:min(100%,700px);background:#fff}.page img{display:block;width:100%;height:auto}.actions{margin-top:10px;display:flex;gap:8px}.actions button{flex:1}.disabled{opacity:.55;pointer-events:none}@media(max-width:900px){.layout{grid-template-columns:1fr}.photoArea{height:360px}}@media print{.bar,.controls,.status,.leftPanel,.previewTitle{display:none!important}.main{padding:0}.layout{display:block}.rightPanel{border:0;padding:0}.preview{padding:0;background:#fff}.page{width:210mm;page-break-after:always}.page:last-child{page-break-after:auto}@page{size:A4 portrait;margin:0}}
</style>
</head>
<body>
<header class="bar"><a href="index.html">← Home</a><strong>Passport / Visa Photo</strong><button id="newBtn" type="button">New Photo</button></header>
<main class="main">
<section class="controls">
<label class="file">📷 Select Photo<input id="file" type="file" accept="image/jpeg,image/png,image/webp,image/bmp,image/*"></label>
<button id="cropBtn" class="btn crop" type="button">Crop</button><button id="applyBtn" class="btn green" type="button">Apply Crop</button>
<div class="field"><label>Size</label><select id="size"><option value="35x45">35 × 45 mm</option><option value="25x35">25 × 35 mm</option><option value="2x2">2 × 2 inch</option></select></div>
<div class="field"><label>Copies</label><select id="copies"><option value="8">8</option><option value="16">16</option><option value="32">32</option></select></div>
<div class="field"><label>Background</label><select id="bg"><option value="#ffffff">White</option><option value="#87cefa">Light Blue</option><option value="#0d6efd">Blue</option><option value="#ff0000">Red</option><option value="#f5f5dc">Cream</option><option value="#00aa00">Green</option><option value="custom">Custom</option></select></div>
<div class="field"><label>Custom</label><input id="custom" type="color" value="#ffffff"></div>
<button id="generate" class="btn green" type="button">Generate Sheet</button><button id="pdf" class="btn crop" type="button">PDF</button><button id="print" class="btn dark" type="button">Print Photos</button>
</section>
<div id="status" class="status">Select a photo to begin.</div>
<section class="layout">
<div class="panel leftPanel"><h3>Photo</h3><div class="photoArea" id="photoArea"><span id="emptyHint" class="hint">Select a photo</span><div id="cropBox" class="cropBox"><div class="handle"></div></div></div><div class="actions"><button id="reset" class="btn gray" type="button">Reset</button></div></div>
<div class="panel rightPanel"><h3 class="previewTitle">A4 Photo-only Preview</h3><div id="preview" class="preview"><span class="hint">Generate the sheet to preview.</span></div></div>
</section></main>
<script>
(function(){
'use strict';
var $=function(id){return document.getElementById(id)};
var fileInput=$('file'),photoArea=$('photoArea'),emptyHint=$('emptyHint'),cropBox=$('cropBox'),status=$('status'),preview=$('preview'),sizeSelect=$('size'),copiesSelect=$('copies'),bgSelect=$('bg'),customColor=$('custom');
var sourceImage=null,workingCanvas=null,pages=[],cropMode=false,dragging=false,resizing=false,dragStart=null;
function statusMsg(t,type){status.textContent=t;status.className='status'+(type?' '+type:'')}
function showCanvas(c){var old=photoArea.querySelector('canvas.photoCanvas');if(old)old.remove();var d=document.createElement('canvas');d.className='photoCanvas';d.width=c.width;d.height=c.height;d.getContext('2d').drawImage(c,0,0);photoArea.insertBefore(d,cropBox);emptyHint.style.display='none'}
function resetCrop(){cropMode=false;cropBox.style.display='none';dragging=false;resizing=false;dragStart=null}
function imageToCanvas(img){var c=document.createElement('canvas');c.width=img.naturalWidth||img.width;c.height=img.naturalHeight||img.height;c.getContext('2d').drawImage(img,0,0);return c}
fileInput.addEventListener('change',function(){var f=fileInput.files&&fileInput.files[0];if(!f)return;if(!/^image\//.test(f.type)){statusMsg('Please select an image file.','err');return}var r=new FileReader();r.onload=function(){var img=new Image();img.onload=function(){sourceImage=img;workingCanvas=imageToCanvas(img);showCanvas(workingCanvas);resetCrop();pages=[];preview.innerHTML='<span class="hint">Click Generate Sheet to create the A4 photo-only sheet.</span>';statusMsg('Photo loaded successfully. Click Crop if you want to crop it.','ok')};img.onerror=function(){statusMsg('The selected image could not be displayed.','err')};img.src=r.result};r.onerror=function(){statusMsg('Could not read the selected file.','err')};r.readAsDataURL(f)});
$('cropBtn').addEventListener('click',function(){if(!workingCanvas){statusMsg('Select a photo first.','err');return}var a=photoArea.getBoundingClientRect();var ratio=workingCanvas.width/workingCanvas.height;var w=Math.min(a.width*0.75,300),h=w/ratio;if(h>a.height*0.75){h=a.height*0.75;w=h*ratio}cropBox.style.width=w+'px';cropBox.style.height=h+'px';cropBox.style.left=((a.width-w)/2)+'px';cropBox.style.top=((a.height-h)/2)+'px';cropBox.style.display='block';cropMode=true;statusMsg('Drag the crop box, then click Apply Crop.','ok')});
cropBox.addEventListener('pointerdown',function(e){if(!cropMode)return;e.preventDefault();var handle=e.target.classList.contains('handle'),r=cropBox.getBoundingClientRect(),a=photoArea.getBoundingClientRect();dragging=!handle;resizing=handle;dragStart={x:e.clientX,y:e.clientY,left:r.left-a.left,top:r.top-a.top,w:r.width,h:r.height};try{cropBox.setPointerCapture(e.pointerId)}catch(_){} });
cropBox.addEventListener('pointermove',function(e){if(!dragStart)return;var a=photoArea.getBoundingClientRect(),dx=e.clientX-dragStart.x,dy=e.clientY-dragStart.y;if(dragging){cropBox.style.left=Math.max(0,Math.min(a.width-dragStart.w,dragStart.left+dx))+'px';cropBox.style.top=Math.max(0,Math.min(a.height-dragStart.h,dragStart.top+dy))+'px'}else if(resizing){var nw=Math.max(50,Math.min(a.width-dragStart.left,dragStart.w+dx)),nh=nw*(dragStart.h/dragStart.w);if(dragStart.top+nh>a.height)nh=a.height-dragStart.top;nw=nh*(dragStart.w/dragStart.h);cropBox.style.width=nw+'px';cropBox.style.height=nh+'px'}});
cropBox.addEventListener('pointerup',function(){dragging=false;resizing=false;dragStart=null});cropBox.addEventListener('pointercancel',function(){dragging=false;resizing=false;dragStart=null});
$('applyBtn').addEventListener('click',function(){if(!workingCanvas){statusMsg('Select a photo first.','err');return}if(!cropMode){statusMsg('Click Crop first.','err');return}var a=photoArea.getBoundingClientRect(),b=cropBox.getBoundingClientRect(),sx=Math.max(0,(b.left-a.left)/a.width*workingCanvas.width),sy=Math.max(0,(b.top-a.top)/a.height*workingCanvas.height),sw=Math.min(workingCanvas.width-sx,b.width/a.width*workingCanvas.width),sh=Math.min(workingCanvas.height-sy,b.height/a.height*workingCanvas.height);if(sw<20||sh<20){statusMsg('Crop area is too small.','err');return}var c=document.createElement('canvas');c.width=Math.round(sw);c.height=Math.round(sh);c.getContext('2d').drawImage(workingCanvas,sx,sy,sw,sh,0,0,c.width,c.height);workingCanvas=c;showCanvas(c);resetCrop();pages=[];statusMsg('Crop applied successfully.','ok')});
function bgColor(){return bgSelect.value==='custom'?customColor.value:bgSelect.value}
function photoDims(){var v=sizeSelect.value;if(v==='25x35')return [Math.round(25/25.4*300),Math.round(35/25.4*300)];if(v==='2x2')return [600,600];return [Math.round(35/25.4*300),Math.round(45/25.4*300)]}
function makePhoto(){if(!workingCanvas)return null;var d=photoDims(),c=document.createElement('canvas');c.width=d[0];c.height=d[1];var x=c.getContext('2d');x.fillStyle=bgColor();x.fillRect(0,0,c.width,c.height);var sr=workingCanvas.width/workingCanvas.height,tr=c.width/c.height,sx=0,sy=0,sw=workingCanvas.width,sh=workingCanvas.height;if(sr>tr){sw=workingCanvas.height*tr;sx=(workingCanvas.width-sw)/2}else{sh=workingCanvas.width/tr;sy=(workingCanvas.height-sh)/2}x.drawImage(workingCanvas,sx,sy,sw,sh,0,0,c.width,c.height);return c}
function makePages(photo,count){var W=2480,H=3508,margin=60,gap=24,pw=photo.width,ph=photo.height,pages=[],p,ctx,x,y,rowH;function np(){p=document.createElement('canvas');p.width=W;p.height=H;ctx=p.getContext('2d');ctx.fillStyle='#fff';ctx.fillRect(0,0,W,H);x=margin;y=margin;rowH=0;pages.push(p)}np();for(var i=0;i<count;i++){if(x+pw>W-margin){x=margin;y+=rowH+gap;rowH=0}if(y+ph>H-margin){np()}ctx.drawImage(photo,x,y);x+=pw+gap;rowH=Math.max(rowH,ph)}return pages}
$('generate').addEventListener('click',function(){if(!workingCanvas){statusMsg('Select a photo first.','err');return}try{var photo=makePhoto();pages=makePages(photo,parseInt(copiesSelect.value,10));preview.innerHTML='';pages.forEach(function(p,i){var wrap=document.createElement('div');wrap.className='page';var img=document.createElement('img');img.src=p.toDataURL('image/jpeg',.96);wrap.appendChild(img);preview.appendChild(wrap)});statusMsg('A4 sheet generated: '+copiesSelect.value+' photo(s).','ok')}catch(e){console.error(e);statusMsg('Generation error: '+e.message,'err')}});
function ensurePages(){if(!pages.length)$('generate').click();return pages.length>0}
$('print').addEventListener('click',function(){if(!ensurePages())return;var w=window.open('','_blank');if(!w){statusMsg('Please allow pop-ups for printing.','err');return}w.document.open();w.document.write('<!doctype html><html><head><title>Photos</title><style>@page{size:A4 portrait;margin:0}html,body{margin:0;padding:0}.p{width:210mm;height:297mm;page-break-after:always}.p:last-child{page-break-after:auto}.p img{width:210mm;height:297mm;display:block}</style></head><body>');pages.forEach(function(p){w.document.write('<div class="p"><img src="'+p.toDataURL('image/jpeg',.98)+'"></div>')});w.document.write('</body></html>');w.document.close();setTimeout(function(){w.focus();w.print()},500)});
function b64Bytes(data){var s=atob(data.split(',')[1]),a=new Uint8Array(s.length);for(var i=0;i<s.length;i++)a[i]=s.charCodeAt(i);return a}
function ascii(s){return new TextEncoder().encode(s)}
function joinBytes(arrs){var n=0;arrs.forEach(function(a){n+=a.length});var o=new Uint8Array(n),p=0;arrs.forEach(function(a){o.set(a,p);p+=a.length});return o}
function buildPdf(){var chunks=[],offsets=[0],pos=0;function addObj(num,bodyParts){offsets[num]=pos;var head=ascii(num+' 0 obj\n');chunks.push(head);pos+=head.length;bodyParts.forEach(function(b){chunks.push(b);pos+=b.length});var end=ascii('\nendobj\n');chunks.push(end);pos+=end.length}var catalog=1,pagesObj=2,next=3,pageObjs=[],imageObjs=[];pages.forEach(function(){pageObjs.push(next++);imageObjs.push(next++)});var kids=pageObjs.map(function(n){return n+' 0 R'}).join(' ');addObj(catalog,[ascii('<< /Type /Catalog /Pages '+pagesObj+' 0 R >>')]);addObj(pagesObj,[ascii('<< /Type /Pages /Kids ['+kids+'] /Count '+pages.length+' >>')]);pages.forEach(function(p,i){var imgNum=imageObjs[i],pageNum=pageObjs[i],jpeg=p.toDataURL('image/jpeg',.97),jb=b64Bytes(jpeg),content='q\n595.28 0 0 841.89 0 0 cm\n/Im1 Do\nQ\n',cb=ascii(content);addObj(pageNum,[ascii('<< /Type /Page /Parent '+pagesObj+' 0 R /MediaBox [0 0 595.28 841.89] /Resources << /XObject << /Im1 '+imgNum+' 0 R >> >> /Contents '+(next+i)+' 0 R >>')]);});var contentNums=[];var base=next;pages.forEach(function(p,i){contentNums.push(base+i)});/* replace page objects with correct content references by rebuilding is easier */
// Rebuild from scratch with deterministic object numbering.
chunks=[];offsets=[0];pos=0;var cat=1,pgs=2, pageN=[],imgN=[],contN=[];for(var i=0;i<pages.length;i++){pageN.push(3+i*3);imgN.push(4+i*3);contN.push(5+i*3)}
addObj(cat,[ascii('<< /Type /Catalog /Pages '+pgs+' 0 R >>')]);addObj(pgs,[ascii('<< /Type /Pages /Kids ['+pageN.map(function(n){return n+' 0 R'}).join(' ')+'] /Count '+pages.length+' >>')]);pages.forEach(function(p,i){var jpeg=p.toDataURL('image/jpeg',.97),jb=b64Bytes(jpeg),content='q\n595.28 0 0 841.89 0 0 cm\n/Im1 Do\nQ\n',cb=ascii(content);addObj(pageN[i],[ascii('<< /Type /Page /Parent '+pgs+' 0 R /MediaBox [0 0 595.28 841.89] /Resources << /XObject << /Im1 '+imgN[i]+' 0 R >> >> /Contents '+contN[i]+' 0 R >>')]);addObj(imgN[i],[ascii('<< /Type /XObject /Subtype /Image /Width '+p.width+' /Height '+p.height+' /ColorSpace /DeviceRGB /BitsPerComponent 8 /Filter /DCTDecode /Length '+jb.length+' >>\nstream\n'),jb,ascii('\nendstream')]);addObj(contN[i],[ascii('<< /Length '+cb.length+' >>\nstream\n'),cb,ascii('endstream')])});var xref=pos, count=offsets.length, tail='xref\n0 '+count+'\n0000000000 65535 f \n';for(var j=1;j<count;j++)tail+=String(offsets[j]).padStart(10,'0')+' 00000 n \n';tail+='trailer\n<< /Size '+count+' /Root '+cat+' 0 R >>\nstartxref\n'+xref+'\n%%EOF';chunks.push(ascii(tail));return joinBytes(chunks)}
$('pdf').addEventListener('click',function(){if(!ensurePages())return;try{var bytes=buildPdf();var blob=new Blob([bytes],{type:'application/pdf'});var a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='passport-photos.pdf';document.body.appendChild(a);a.click();setTimeout(function(){URL.revokeObjectURL(a.href);a.remove()},1000);statusMsg('PDF generated successfully. Photos only.','ok')}catch(e){console.error(e);statusMsg('PDF error: '+e.message,'err')}});
function resetAll(){fileInput.value='';sourceImage=null;workingCanvas=null;pages=[];var old=photoArea.querySelector('canvas.photoCanvas');if(old)old.remove();emptyHint.style.display='';preview.innerHTML='<span class="hint">Generate the sheet to preview.</span>';resetCrop();statusMsg('Select a photo to begin.')}
$('newBtn').addEventListener('click',resetAll);$('reset').addEventListener('click',resetAll);bgSelect.addEventListener('change',function(){if(workingCanvas)statusMsg('Background selected. Click Generate Sheet to apply it.','ok')});customColor.addEventListener('input',function(){if(bgSelect.value==='custom'&&workingCanvas)statusMsg('Custom background selected. Click Generate Sheet to apply it.','ok')});
})();
</script>
</body></html>
