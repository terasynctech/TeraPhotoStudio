<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>PVC Card | TeraPhotoStudio V3</title><link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.6.2/cropper.min.css"><link rel="stylesheet" href="css/pvc.css"></head><body>
<header class="appbar"><a href="index.html" class="brand">📸 TeraPhotoStudio <small>V3</small></a><a href="index.html" class="navBtn">← Dashboard</a></header>
<main class="pvcApp"><section class="panel controls"><div class="title"><div><h1>PVC Card Studio</h1><p>CR80 card size: 85.60 × 53.98 mm.</p></div><button id="newBtn" class="outline">New Card</button></div><div class="uploadGrid"><div><label>Front</label><input id="frontUpload" type="file" accept="image/*"><button id="frontChoose" class="choose">📷 Select Front</button><button id="cropFrontBtn" class="secondary">✂ Crop Front</button></div><div><label>Back</label><input id="backUpload" type="file" accept="image/*"><button id="backChoose" class="choose">📷 Select Back</button><button id="cropBackBtn" class="secondary">✂ Crop Back</button></div></div><div class="actions"><button id="generateBtn" class="primary">Generate A4</button><button id="downloadBtn" class="success">Download PDF</button><button id="downloadJpgBtn" class="outline">Download JPG</button><button id="printBtn" class="dark">Print</button></div><div id="status" class="status">Select front and back scans to begin.</div></section>
<section class="panel"><div class="previewHead"><h2>Card Preview</h2><span>Print contains cards only</span></div><div class="cards"><div><h3>Front</h3><div id="frontPreview" class="previewBox">No front image</div></div><div><h3>Back</h3><div id="backPreview" class="previewBox">No back image</div></div></div><div class="sheetWrap"><h3>A4 Output</h3><div id="sheetPreview" class="sheetPreview"><span>Generate A4 to preview.</span></div></div></section></main>
<div id="cropModal" class="modal hidden"><div class="modalBox"><div class="modalHead"><h2>Crop Card</h2><button id="closeCrop">×</button></div><div class="cropArea"><img id="cropImage" alt="Crop"></div><div class="modalActions"><button id="cancelCrop" class="outline">Cancel</button><button id="applyCrop" class="primary">Apply Crop</button></div></div></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.6.2/cropper.min.js"></script><script src="js/pvc.js"></script></body></html>
