<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>PVC Card</title><link rel="stylesheet" href="css/pvc.css"><link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.6.2/cropper.min.css"></head><body><header class="studioBar"><a href="index.html" class="homeBtn">← Home</a><div><b>PVC Card</b><small>CR80 • 86 × 54 mm</small></div><button id="newBtn" class="outline">New Card</button></header><main><section class="controls"><label>Front<input id="frontUpload" type="file" accept="image/*"></label><button id="cropFrontBtn" class="blue">Crop Front</button><label>Back<input id="backUpload" type="file" accept="image/*"></label><button id="cropBackBtn" class="blue">Crop Back</button><button id="generateBtn" class="green">Generate</button><button id="downloadBtn" class="blue">JPG</button><button id="printBtn" class="dark">Print Card</button></section><div id="status" class="status">Select front and back images.</div><section class="grid"><div class="panel"><h3>Front</h3><div id="frontPreview" class="previewBox">No image</div></div><div class="panel"><h3>Back</h3><div id="backPreview" class="previewBox">No image</div></div></section><div class="result"><h3>Preview</h3><canvas id="pvcCanvas"></canvas></div></main><script src="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.6.2/cropper.min.js"></script><script src="js/pvc.js"></script></body></html>
