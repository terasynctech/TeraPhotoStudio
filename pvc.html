<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>PVC Card V3</title><style>*{box-sizing:border-box}body{margin:0;font-family:Arial,Segoe UI,sans-serif;background:#eef2f6;color:#172033}.bar{height:68px;background:#fff;border-bottom:1px solid #dfe5ec;display:flex;align-items:center;gap:12px;padding:0 18px}.bar a,.bar button{border:1px solid #ccd5df;background:#fff;border-radius:8px;padding:10px 14px;text-decoration:none;color:#172033;cursor:pointer}.bar strong{flex:1}.main{max-width:1200px;margin:auto;padding:20px}.controls{background:#fff;border:1px solid #dfe5ec;border-radius:14px;padding:16px;display:flex;gap:12px;align-items:end;flex-wrap:wrap}.file{background:#1769e0;color:#fff;padding:11px 15px;border-radius:8px;font-weight:bold;cursor:pointer}.file input{display:none}.btn{height:40px;border:0;border-radius:7px;padding:0 15px;color:#fff;font-weight:bold;cursor:pointer}.green{background:#138a50}.dark{background:#26364d}.status{margin:12px 0;padding:10px;border-radius:8px;background:#e8f1ff}.status.err{background:#fff0f0;color:#9b1c1c}.grid{display:grid;grid-template-columns:1fr 1fr;gap:18px}.panel{background:#fff;padding:15px;border:1px solid #dfe5ec;border-radius:14px}.box{height:350px;background:#f5f7fa;border:1px dashed #bcc6d2;border-radius:10px;display:flex;align-items:center;justify-content:center;overflow:hidden}.box img{max-width:100%;max-height:100%}.result{margin-top:18px;background:#fff;padding:15px;border:1px solid #dfe5ec;border-radius:14px}.result canvas{max-width:100%;height:auto;display:block;margin:auto}@media(max-width:750px){.grid{grid-template-columns:1fr}}</style></head><body><header class="bar"><a href="index.html">← Home</a><strong>PVC Card V3</strong><button id="new">New Card</button></header><main class="main"><section class="controls"><label class="file">Front Photo<input id="front" type="file" accept="image/*"></label><label class="file">Back Photo<input id="back" type="file" accept="image/*"></label><button id="generate" class="btn green">Generate Card</button><button id="jpg" class="btn green">Download JPG</button><button id="print" class="btn dark">Print Card</button></section><div id="status" class="status">Select front and back images.</div><section class="grid"><div class="panel"><h3>Front</h3><div id="fp" class="box">No image</div></div><div class="panel"><h3>Back</h3><div id="bp" class="box">No image</div></div></section><div class="result"><h3>Card Preview</h3><canvas id="canvas" width="2032" height="638"></canvas></div></main><script>const $=x=>document.getElementById(x),c=$('canvas'),ctx=c.getContext('2d');let f='',b='';function msg(t,e=''){$('status').textContent=t;$('status').className='status '+e}function load(input,box,side){input.onchange=()=>{const file=input.files[0];if(!file)return;const r=new FileReader();r.onload=e=>{const im=new Image();im.onload=()=>{if(side==='f')f=e.target.result;else b=e.target.result;box.innerHTML='';box.appendChild(im);msg('Image selected. Click Generate Card.','ok')};im.src=e.target.result};r.readAsDataURL(file)}}load($('front'),$('fp'),'f');load($('back'),$('bp'),'b');function generate(){if(!f||!b)return msg('Please select both front and back images.','err');ctx.fillStyle='#fff';ctx.fillRect(0,0,2032,638);const a=new Image(),d=new Image();a.onload=()=>{ctx.drawImage(a,0,0,1016,638);d.onload=()=>{ctx.drawImage(d,1016,0,1016,638);msg('PVC card generated.','ok')};d.src=b};a.src=f}$('generate').onclick=generate;$('jpg').onclick=()=>{if(!f||!b)generate();setTimeout(()=>{const a=document.createElement('a');a.href=c.toDataURL('image/jpeg',.96);a.download='pvc-card.jpg';a.click()},300)};$('print').onclick=()=>{if(!f||!b)return msg('Generate the card first.','err');generate();setTimeout(()=>{const w=window.open('','_blank');if(!w)return;w.document.write('<style>@page{size:171.2mm 54mm;margin:0}body{margin:0}img{width:171.2mm;height:54mm}</style><img src="'+c.toDataURL('image/jpeg',.96)+'">');w.document.close();w.onload=()=>w.print()},300)};$('new').onclick=()=>location.reload();</script></body></html>
